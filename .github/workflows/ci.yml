name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: 自检(${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 零依赖:没有 npm install 这一步
      - name: 确认零依赖
        shell: bash
        run: |
          if [ -f package.json ]; then echo "::error::不应该有 package.json"; exit 1; fi
          if [ -d node_modules ]; then echo "::error::不应该有 node_modules"; exit 1; fi
          echo "零依赖 ✓"

      - name: 语法检查
        shell: bash
        run: |
          for f in server.mjs monitor.mjs selftest.mjs lib/*.mjs; do
            node --check "$f" || exit 1
          done
          echo "语法检查通过 ✓"

      - name: 运行自检
        run: node selftest.mjs

      - name: 确认核心文件存在
        shell: bash
        run: |
          for f in server.mjs monitor.mjs config.json public/index.html lib/notify.mjs lib/collect.mjs; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          echo "文件齐全 ✓"
